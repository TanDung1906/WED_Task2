<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <!-- Icon / Logo -->
    <div class="login-avatar">M</div>

    <!-- Header Titles -->
    <h2 class="login-header-title">Welcome Back!</h2>
    <p class="login-header-subtitle">Sign in to continue to your account.</p>

    <!-- Form Card -->
    <div class="login-card">
      <h3 class="login-card-title">Login to your account</h3>
      <p class="login-card-subtitle">Enter your email and password to get started.</p>

      <form action="home.html" method="GET">
        <!-- Email Input -->
        <div class="mb-3">
          <label for="email" class="form-label form-label-custom">Email Address</label>
          <input type="email" class="form-control input-custom" id="email" placeholder="fpt@gmail.com" required>
        </div>

        <!-- Password Input -->
        <div class="mb-3">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="password" class="form-label form-label-custom mb-0">Password</label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>
          <div class="password-wrapper">
            <input type="password" class="form-control input-custom" id="password" placeholder="12345678" required>
            <button type="button" class="password-toggle-btn" id="togglePassword">Show</button>
          </div>
        </div>

        <!-- Remember me -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="rememberMe">
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-signin">Sign In</button>

        <!-- Create Account link -->
        <p class="bottom-text">
          Don't have an account? <a href="#">Create an account</a>
        </p>
      </form>
    </div>

    <!-- Footer Copyright -->
    <div class="login-footer-copy">
      &copy; 2026 My Website. All rights reserved.
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
